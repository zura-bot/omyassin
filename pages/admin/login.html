<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - OSIS & MPK SMA YAS SINDANGKERTA</title>

  <link id="theme-stylesheet" rel="stylesheet" href="/css/theme-dark-blue.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="https://raw.githubusercontent.com/zura-bot/ZuraOppicial.github.io/00b74876079a1891cb0f666cfd6704d89ae6676d/index/6fa69016-efe7-443b-87d0-8ca1ca2a18a1.png" alt="Logo" />
        <h1>Admin Dashboard</h1>
        <p>OSIS & MPK SMA YAS SINDANGKERTA</p>
      </div>

      <form id="login-form" class="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" placeholder="admin@sekolah.sch.id" required />

        <label for="login-password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="login-password" name="password" placeholder="••••••••" required />
          <button type="button" id="toggle-password" class="toggle-password" aria-label="Tampilkan password">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-primary btn-block">
          Masuk
        </button>
      </form>

      <div id="login-alert" class="pesan-alert" hidden></div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
